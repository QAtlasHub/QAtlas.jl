name: Release Drafter

on:
  push:
    branches:
      - main
  # Required for the autolabeler job below to act on PRs as they are opened/edited.
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  # Cancel a PR's superseded runs when it is pushed again; queue (never cancel)
  # runs on main, where these workflows publish or record state.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # v7 split autolabeling out into its own action. Until this was noticed the PR event called
  # the releaser, which labels nothing: it checks out `refs/pull/N/merge`, calls that "an
  # ephemeral pull request merge commit" and forces dry-run. Measured on one push before the
  # fix: 137 releases fetched, 291 commits walked, 93 merged PRs resolved and a 9489-character
  # body built, all discarded, while every `feat:`/`fix:`/`ci:` PR went unlabelled and so landed
  # uncategorised in the draft. The two actions are cheap and expensive respectively, and each
  # belongs to exactly one of the two events.
  autolabel:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write  # autolabeler writes labels back to PRs
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_release_draft:
    if: github.event_name == 'push'
    permissions:
      contents: write       # release-drafter writes the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
