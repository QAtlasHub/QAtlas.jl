name: Release Drafter

on:
  push:
    branches:
      - main
  # Required for autolabeler to act on PRs as they are opened/edited.
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  # Cancel a PR's superseded runs when it is pushed again; queue (never cancel)
  # runs on main, where these workflows publish or record state.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write       # release-drafter writes the draft release
      pull-requests: write  # autolabeler writes labels back to PRs
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
