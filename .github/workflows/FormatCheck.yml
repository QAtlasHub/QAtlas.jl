name: Format Check
# Runs on every PR (no path filter): format-check is a *required* status check,
# so it must always report — a path-filtered required check never reports on
# PRs that don't touch the filtered paths and blocks the merge forever.
#
# Kept inline, and kept under this job name, only because branch protection
# requires the bare context `format-check` while a reusable caller reports as
# `format / format-check`; switching deadlocks until the required context is
# swapped. QAtlasHub/QAtlas.jl#795 tracks that migration. The body below is
# byte-identical to the org reusable so the two cannot drift in the meantime.
on:
  pull_request:

concurrency:
  # Cancel a PR's superseded runs when it is pushed again; queue (never cancel)
  # runs on main, where these workflows publish or record state.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      # `Pkg.activate(; temp=true)` is load-bearing. A bare `Pkg.add` resolves into the runner's
      # shared/default environment, where the compat bounds already there cap the result: the same
      # commit resolved JuliaFormatter 2.3.2 on a self-hosted runner and 2.10.1 on a GitHub-hosted
      # one, and a leftover ITensorFormatter in such a depot once made the install fail outright.
      #
      # The version floats. This file pinned 2.12.3, then 2.14.0, on the theory that the pin was
      # what made the check reproducible; the shared env was. A pin only defers the reflow and
      # grows it, and it drifted this repo away from every sibling on the org reusable.
      - name: JuliaFormatter check
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)                       # clean env — no depot compat capping the resolve
          Pkg.add(PackageSpec(name = "JuliaFormatter", version = "2"))
          using JuliaFormatter
          v = pkgversion(JuliaFormatter)
          # `using` falls back to the depot's default env when the active project does not declare
          # the package, loading a different version and saying nothing, so ask the project itself.
          declared = [p.version for (_, p) in Pkg.dependencies() if p.name == "JuliaFormatter"]
          if declared != [v]
              println(stderr, "❌ JuliaFormatter $v came from outside the temp project, which holds $declared.")
              exit(1)
          end
          @info "JuliaFormatter $v"
          ok = format("."; verbose = true, overwrite = false)
          if !ok
              println(stderr, "❌ Not formatted, under JuliaFormatter $v. `overwrite=false` above is the check;")
              println(stderr, "   locally you want `true`, and one pass does not always converge. Run:")
              println(stderr, "   julia -e 'using Pkg; Pkg.activate(;temp=true); Pkg.add(PackageSpec(name=\"JuliaFormatter\", version=\"2\")); using JuliaFormatter; for _ in 1:5; format(\".\"; overwrite=true) && break end'")
              exit(1)
          end
          println("✅ All files properly formatted.")
