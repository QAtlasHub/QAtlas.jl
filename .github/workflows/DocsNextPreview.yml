name: Docs (next preview)

on:
  push:
    branches:
      - next

concurrency:
  # Cancel a PR's superseded runs when it is pushed again; queue (never cancel)
  # runs on main, where these workflows publish or record state.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  inventory-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: INVENTORY drift guard (static scan, no test exec)
        run: julia --startup-file=no test/harness/atlas/test_inventory_drift.jl
      - name: Atlas taxonomy + registry-parser unit tests
        run: julia --startup-file=no test/harness/atlas/test_atlas_logic.jl

  docs-preview:
    runs-on: ubuntu-latest
    needs: inventory-drift
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install docs env
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Regenerate atlas view (pure scan; no test exec)
        run: julia --startup-file=no docs/atlas/generate.jl
      - name: Build docs (build-only, deploydocs is a no-op without token)
        run: julia --project=docs/ docs/make.jl
      - name: Upload built site (trial deploy artifact)
        uses: actions/upload-artifact@v7
        with:
          name: tfim-atlas-docs
          path: docs/build
          if-no-files-found: error
