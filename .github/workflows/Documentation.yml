name: Documentation
on:
  push:
    branches:
      - main
    tags: '*'
  # Run on every PR (any base), not just main-targeting ones, so stacked PRs
  # build the docs and get a Documenter push_preview deploy. deploydocs only
  # publishes the live site on push to main; PRs get previews/PR<N>.
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel a PR's superseded runs when it is pushed again; queue (never cancel)
  # runs on main, where these workflows publish or record state.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  statuses: write
  pull-requests: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Regenerate atlas view (pure scan; no test exec)
        run: julia --startup-file=no docs/atlas/generate.jl
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs/ docs/make.jl
      # This step and the two below are notifications, not the deliverable, so none of them
      # may decide this job's verdict: they depend on the installation's API budget rather
      # than on the diff. Measured on 2026-09-13, when `find-comment` hit "API rate limit
      # exceeded for installation" and turned a docs build that had already deployed into a
      # red required check. Best-effort, but printed rather than swallowed.
      - name: Trigger GitHub Pages rebuild
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true)
          case "$code" in
            2*) echo "pages/builds -> $code" ;;
            *) echo "::warning::pages/builds returned ${code:-no response}; Pages rebuilds on its own schedule anyway" ;;
          esac
      # The preview URL is a pure function of the PR number, so restating it on every push
      # spent API calls to say something that cannot have changed: `find-comment` pages through
      # the PR's comments, then `create-or-update-comment` rewrites an identical body. That ran
      # 21 times on one PR. The summary costs nothing and is always current; the comment is
      # posted once, when there is nothing to search for yet.
      - name: Preview URL in the run summary
        if: github.event_name == 'pull_request'
        run: |
          echo "📚 [Docs preview](https://codes.sota-shimozono.com/QAtlas.jl/previews/PR${{ github.event.pull_request.number }}/)" >> "$GITHUB_STEP_SUMMARY"
      - name: Post preview URL to PR
        if: github.event_name == 'pull_request' && github.event.action == 'opened' && success()
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            📚 **Docs preview**: https://codes.sota-shimozono.com/QAtlas.jl/previews/PR${{ github.event.pull_request.number }}/

            *(the site is rebuilt on each push; this link does not change)*
