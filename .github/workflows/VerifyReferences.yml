name: Verify references
# Every DOI / arXiv id in the bibliography must resolve to real metadata
# (Crossref / arXiv), or this check fails. Delegated to the shared
# QAtlasHub/doiget-citation-check action (prebuilt doiget + gate + allow-list
# + sticky PR comment) so the whole fleet runs one identical, canonical check.
on:
  pull_request:
    paths: ['docs/references.bib', 'docs/references.allow', 'docs/references.title-allow', 'docs/check_reference_titles.py', '.github/workflows/VerifyReferences.yml']
  push:
    branches: [main]
    paths: ['docs/references.bib', 'docs/references.allow', 'docs/references.title-allow', 'docs/check_reference_titles.py']
  workflow_dispatch:
concurrency:
  # Cancel a PR's superseded runs when it is pushed again; queue (never cancel)
  # runs on main, where these workflows publish or record state.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: QAtlasHub/doiget-citation-check@v1
        with:
          bib: docs/references.bib
          allow: docs/references.allow
      # The action above gates on whether a DOI RESOLVES. That cannot see a one-character
      # slip that lands on somebody else's real paper — measured on this bibliography, 2 of
      # 18 sampled DOIs have a resolving neighbour one digit away. Comparing the title does.
      - name: Cross-check titles against Crossref
        run: python3 docs/check_reference_titles.py docs/references.bib docs/references.title-allow
