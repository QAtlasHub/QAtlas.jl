name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# The whole sharded-test vertical lives in TestShards.jl. Nothing is planned up front — each
# shard decides what it owns from the same timing history — and the reusable merges the shards'
# coverage into one Codecov upload, merges their records into one ordered document, checks that
# every unit ran exactly once, and refreshes the `ci-timings` branch on pushes to main.
#
# Called DIRECTLY, and passing the secret, because this repository is public and in the same
# organisation as TestShards. A secret fails to reach a called workflow only when the caller is
# PRIVATE and the callee is in ANOTHER organisation; neither holds here. The private repos in the
# fleet go through their own organisation's wrapper instead.
jobs:
  test:
    permissions:
      contents: write   # the timing history is pushed to the `ci-timings` orphan branch
    uses: QAtlasHub/TestShards.jl/.github/workflows/sharded-tests.yml@main
    with:
      # 8 on a pull request, 16 on the default branch, as before — a PR is the common case and
      # extra shards there queue rather than finish sooner. The diagnosis printed on every run
      # names the knee for this suite.
      shards: ${{ github.event_name == 'pull_request' && 8 || 16 }}
      # Also refreshes, which matters more than it looks: a registry that is present but STALE
      # resolves fine while failing to see anything published since it was last pulled.
      registries: |
        General
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # NOT part of the sharded suite, and that is the point. `test/harness/atlas/` is the v2 atlas
  # infrastructure: the old universe.jl kept it out of the shard universe as a sanctioned
  # exception, "run by dedicated CI jobs", and THIS is the dedicated job. runtests.jl skips
  # harness/ for the same reason, so without this the three files there would run nowhere.
  #
  # It is also a required check on the default branch, so deleting it does not merely lose the
  # coverage — it makes every pull request unmergeable, because a required check that never
  # runs is not the same as one that is skipped.
  #
  # Static: it scans and compares, and never executes the suite.
  inventory:
    name: INVENTORY drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Static scan must equal committed INVENTORY.jsonl (no test exec)
        run: julia --startup-file=no test/harness/atlas/test_inventory_drift.jl
      - name: Atlas taxonomy + registry-parser unit tests
        run: julia --startup-file=no test/harness/atlas/test_atlas_logic.jl
